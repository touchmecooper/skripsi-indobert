<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistem Klasifikasi Jurnal IndoBERT{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #16233F;
            --navy-light: #22335A;
            --bg: #F4F6F9;
            --surface: #FFFFFF;
            --border: #E2E8F0;
            --text-primary: #1A202C;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --nav-inactive: #8C97AE;
            --accent: #D97706;
            --accent-light: #FEF3E2;
            --accent-text: #92400E;
            --blue: #2563EB;
            --blue-light: #EFF6FF;
            --green: #16A34A;
            --green-light: #F0FDF4;
            --orange: #EA580C;
            --orange-light: #FFF7ED;
            --red: #DC2626;
            --red-light: #FEF2F2;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text-primary);
        }
        a { color: inherit; }

        /* ===== NAV BAR ===== */
        nav.topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
            padding: 0 48px;
            background: var(--navy);
        }
        nav.topbar .logo {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }
        nav.topbar .nav-links {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        nav.topbar .nav-links a {
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            color: var(--nav-inactive);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        nav.topbar .nav-links a.active {
            color: #fff;
            font-weight: 600;
        }
        nav.topbar .nav-links a.active::after {
            content: "";
            display: block;
            width: 100%;
            height: 2px;
            background: var(--accent);
        }

        /* ===== LAYOUT ===== */
        .page-wrap {
            max-width: 1280px;
            margin: 0 auto;
            padding: 48px 80px 80px;
        }
        .page-header {
            margin-bottom: 32px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 6px;
        }
        .page-header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
        }
        .page-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        /* ===== CARD ===== */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
        }

        /* ===== FORM ELEMENTS ===== */
        label.field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px 14px;
            font-size: 13px;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #FBFCFD;
            color: var(--text-primary);
        }
        input[type="text"]::placeholder, textarea::placeholder { color: var(--text-muted); }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
        }
        .btn-accent { background: var(--accent); color: #fff; }
        .btn-accent:hover { background: #C2650A; }
        .btn-navy { background: var(--navy); color: #fff; }
        .btn-navy:hover { background: var(--navy-light); }
        .btn-danger-outline { background: var(--red-light); color: var(--red); border: 1px solid var(--red); }
        .btn-danger-outline:hover { background: #FEE2E2; }

        /* ===== BADGE ===== */
        .badge {
            display: inline-flex;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge.Teknologi { background: var(--blue-light); color: var(--blue); }
        .badge.Medis { background: var(--green-light); color: var(--green); }
        .badge.Edukasi { background: var(--orange-light); color: var(--orange); }

        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot.Teknologi { background: var(--blue); }
        .dot.Medis { background: var(--green); }
        .dot.Edukasi { background: var(--orange); }

        /* ===== FLASH MESSAGES ===== */
        .flash {
            padding: 14px 18px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 13px;
        }
        .flash.success { background: var(--green-light); color: #15803D; border: 1px solid #BBF7D0; }
        .flash.error { background: var(--red-light); color: #B91C1C; border: 1px solid #FECACA; }

        /* ===== TABLES (dipakai di halaman test model) ===== */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td, th { padding: 8px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; }
    </style>
</head>
<body>
    <nav class="topbar">
        <div class="logo">Sistem Klasifikasi Jurnal IndoBERT</div>
        <div class="nav-links">
            <a href="{{ url_for('upload_page') }}" class="{{ 'active' if request.endpoint in ['upload_page', 'upload_submit'] else '' }}">Upload Jurnal (PDF)</a>
            <a href="{{ url_for('article_list') }}" class="{{ 'active' if request.endpoint in ['article_list', 'article_detail'] else '' }}">Daftar Artikel</a>
        </div>
    </nav>

    <div class="page-wrap">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
